<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- Moment de la journée ---------- */
const MODE = new URLSearchParams(location.search).get('mode') || 'sunset';
const PRESETS = {
  morning: {
    plate: '朝の街角',
    sky: [[0, '#5fb2ea'], [0.45, '#94d0f2'], [0.8, '#cdeaf4'], [1, '#fdf0dc']],
    fog: ['#d4ebf5', 0.004],
    hemi: ['#d6ecff', '#b8a68e', 0.95], amb: ['#fff6e6', 0.3],
    sun: ['#fff3da', 1.9, [10, 14, 9]], rim: ['#bfe0ff', 0.35, [-9, 6, 10]],
    lights: 0, interior: 2.5, lamp: 0, vend: 1,
    winDim: '#a9c6e4', winLit: '#d4e6f4',
    bloom: [0.22, 0.4, 0.95],
    disc: {
      inner: '#fffef6', outer: '#fff0b8', size: 0.15, k: 1.4, x: 0.6, y: 0.66, haloSize: 1.15, rays: true,
      halo: [[0, 'rgba(255,250,228,0.6)'], [0.12, 'rgba(255,244,210,0.3)'], [0.4, 'rgba(255,240,210,0.08)'], [1, 'rgba(255,240,210,0)']]
    },
    stars: 0, meteors: false,
    clouds: { n: 8, top: '#ffffff', shade: '#d5e4f3', line: 'rgba(110,135,175,0.35)', opacity: 0.95, yMin: 0.15, yMax: 0.9 },
    birds: { n: 6, color: '#4b4258' }, fireflies: 0,
    puddle: { cold: ['rgba(200,232,255,0.6)', 'rgba(150,195,235,0.35)'], warm: ['rgba(255,245,215,0.7)', 'rgba(160,205,240,0.4)'] },
    smoke: ['#ffffff', 0.45], steam: 0.8
  },
  sunset: {
    plate: '夕暮れの街角',
    sky: [[0, '#2a2766'], [0.3, '#5e4596'], [0.58, '#d9708e'], [0.8, '#f8a467'], [1, '#ffd69a']],
    fog: ['#c27a8e', 0.004],
    hemi: ['#ffb9a4', '#4a3a6c', 0.6], amb: ['#b07898', 0.25],
    sun: ['#ffa56c', 1.9, [-12, 4.5, 7]], rim: ['#8d7ce6', 0.55, [9, 6, -8]],
    lights: 0.8, interior: 9, lamp: 9, vend: 0.85,
    winDim: '#8e6fa2', winLit: null,
    bloom: [0.6, 0.5, 0.88],
    disc: {
      inner: '#fff5d4', outer: '#ff9a5c', size: 0.3, k: 1.25, x: -0.62, y: 0.1, haloSize: 1.7, rays: false,
      halo: [[0, 'rgba(255,205,145,0.65)'], [0.15, 'rgba(255,155,115,0.32)'], [0.45, 'rgba(240,110,125,0.1)'], [1, 'rgba(200,90,140,0)']]
    },
    stars: 0.22, meteors: false,
    clouds: { n: 7, top: '#ffcfae', shade: '#c56e90', line: 'rgba(90,50,100,0.35)', opacity: 0.95, yMin: -0.05, yMax: 0.65 },
    birds: { n: 5, color: '#3a2840' }, fireflies: 0,
    puddle: { cold: ['rgba(255,175,150,0.55)', 'rgba(150,110,175,0.4)'], warm: ['rgba(255,205,125,0.85)', 'rgba(205,120,145,0.5)'] },
    smoke: ['#e8b9c2', 0.4], steam: 0.65
  },
  night: {
    plate: '夜の街角',
    sky: [[0, '#070c2b'], [0.45, '#12205a'], [0.8, '#22377a'], [1, '#34498c']],
    fog: ['#16214f', 0.0045],
    hemi: ['#7088d0', '#1a1f3e', 0.7], amb: ['#4a5aa0', 0.3],
    sun: ['#a9bcff', 1.15, [9, 12, -8]], rim: ['#6f7fd8', 0.45, [-9, 5, 10]],
    lights: 1, interior: 11, lamp: 13, vend: 0.62,
    winDim: '#46528a', winLit: null,
    bloom: [0.85, 0.5, 0.85],
    disc: {
      inner: '#fffdf0', outer: '#ece6c6', craters: true, size: 0.2, k: 0.82, x: 0.6, y: 0.68, haloSize: 0.9, rays: false,
      halo: [[0, 'rgba(200,215,255,0.3)'], [0.15, 'rgba(170,190,250,0.16)'], [0.4, 'rgba(140,160,235,0.05)'], [0.7, 'rgba(120,140,220,0.012)'], [1, 'rgba(120,140,220,0)']]
    },
    stars: 1, meteors: true,
    clouds: { n: 4, top: '#34437e', shade: '#222c5c', line: 'rgba(10,14,40,0.35)', opacity: 0.85, yMin: 0.1, yMax: 0.7 },
    birds: null, fireflies: 22,
    puddle: { cold: ['rgba(120,145,215,0.55)', 'rgba(70,90,160,0.4)'], warm: ['rgba(255,200,120,0.85)', 'rgba(90,100,170,0.55)'] },
    smoke: ['#9aa3cf', 0.35], steam: 0.65
  }
};
const P = PRESETS[MODE] || PRESETS.night;
document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.m === MODE));

/* ---------- Renderer / scène ---------- */
const W = () => innerWidth, H = () => innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W() / H(), 0.1, 300);

/* ---------- Utilitaires ---------- */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}

// Dégradé toon à 4 paliers
const grad = (() => {
  const t = new THREE.DataTexture(new Uint8Array([95, 165, 220, 255]), 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const cache = new Map();
function toon(c) {
  if (Array.isArray(c) || c instanceof THREE.Material) return c;
  if (!cache.has(c)) cache.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: grad }));
  return cache.get(c);
}
const toonMap = (map) => new THREE.MeshToonMaterial({ map, gradientMap: grad });
// Matériau lumineux : allumé selon P.lights (éteint = simple teinte pâle)
function glow(c, k = 2.6) {
  const m = new THREE.MeshBasicMaterial({ color: c });
  m.color.multiplyScalar(THREE.MathUtils.lerp(0.85, k, P.lights));
  return m;
}

// Contour « encre » par coque inversée
const INK = new THREE.MeshBasicMaterial({ color: '#3b2838', side: THREE.BackSide });
function outline(mesh, t) {
  const g = mesh.geometry; g.computeBoundingBox();
  const s = new THREE.Vector3(), c = new THREE.Vector3();
  g.boundingBox.getSize(s); g.boundingBox.getCenter(c);
  if (Math.min(s.x, s.y, s.z) < 1e-4) return;
  const sc = new THREE.Vector3((s.x + 2 * t) / s.x, (s.y + 2 * t) / s.y, (s.z + 2 * t) / s.z);
  const o = new THREE.Mesh(g, INK);
  o.scale.copy(sc);
  o.position.copy(c).multiply(new THREE.Vector3(1, 1, 1).sub(sc));
  mesh.add(o);
}
function add(geo, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(geo, toon(mat));
  m.position.set(x, y, z);
  if (o.rot) m.rotation.set(...o.rot);
  if (o.scale) m.scale.set(...o.scale);
  const lit = Array.isArray(m.material) || !(m.material.isMeshBasicMaterial || m.material.transparent);
  m.castShadow = lit && o.cast !== false;
  m.receiveShadow = lit;
  if (lit && o.outline !== false) outline(m, o.t ?? 0.022);
  (o.parent || scene).add(m);
  return m;
}
const B = (w, h, d, mat, x, y, z, o) => add(new THREE.BoxGeometry(w, h, d), mat, x, y + h / 2, z, o);
const Cy = (rt, rb, h, mat, x, y, z, o = {}) => add(new THREE.CylinderGeometry(rt, rb, h, o.seg || 20), mat, x, y + h / 2, z, o);
const Co = (r, h, mat, x, y, z, o = {}) => add(new THREE.ConeGeometry(r, h, o.seg || 16), mat, x, y + h / 2, z, o);
const Sp = (r, mat, x, y, z, o = {}) => add(new THREE.SphereGeometry(r, o.seg || 20, Math.max(8, ((o.seg || 20) * 0.6) | 0)), mat, x, y, z, o);
function rod(a, b, r, mat, o = {}) {
  const A = new THREE.Vector3(...a), Bv = new THREE.Vector3(...b), d = Bv.clone().sub(A);
  const m = add(new THREE.CylinderGeometry(r, r, d.length(), 8), mat, 0, 0, 0, o);
  m.position.copy(A).add(Bv).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}
function G(x, y, z, ry = 0, parent = scene) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; }
const boxMats = (base, face, idx = 4) => { const a = Array(6).fill(toon(base)); a[idx] = face; return a; };
const radial = (stops) => canvasTex(256, 256, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  for (const [o, c] of stops) r.addColorStop(o, c);
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});

/* ---------- Palette ---------- */
const C = {
  sage: '#93b89f', cream: '#f6e7cf', peach: '#f4c6b2', trim: '#fdf5e8',
  wood: '#b07b5f', dark: '#5b4450', roof: '#7489b0', leaf: '#86b880', iron: '#4a5068'
};
const y0 = 0.15; // dessus du trottoir

/* ---------- Ciel ---------- */
scene.background = canvasTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  for (const [o, c] of P.sky) gr.addColorStop(o, c);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

/* ---------- Lumières ---------- */
scene.add(new THREE.HemisphereLight(...P.hemi));
scene.add(new THREE.AmbientLight(...P.amb));
const sun = new THREE.DirectionalLight(P.sun[0], P.sun[1]);
sun.position.set(...P.sun[2]);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const rim = new THREE.DirectionalLight(P.rim[0], P.rim[1]);
rim.position.set(...P.rim[2]); scene.add(rim);
scene.fog = new THREE.FogExp2(...P.fog);

/* ---------- Socle de collection ---------- */
B(13.8, 0.32, 13.8, '#5e4452', 0, -1.42, 0);
B(13.5, 0.06, 13.5, '#dcb872', 0, -1.1, 0, { outline: false });
B(13, 0.25, 13, '#7a5446', 0, -1.04, 0);
B(13, 0.79, 13, '#a87c62', 0, -0.79, 0);
for (let i = 0; i < 28; i++) { // cailloux dans la coupe de terre
  const side = i % 4, u = (rnd() - 0.5) * 12, v = -0.2 - rnd() * 0.7;
  const p = [[u, v, 6.5], [u, v, -6.5], [6.5, v, u], [-6.5, v, u]][side];
  Sp(0.06 + rnd() * 0.07, rnd() > 0.5 ? '#c49c82' : '#8f6b5b', ...p, { scale: [1, 0.7, 1], outline: false, cast: false, seg: 10 });
}
const plateTex = canvasTex(720, 36, (g, w, h) => {
  g.fillStyle = '#dcb872'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#8a6a3c'; g.lineWidth = 2; g.strokeRect(3, 3, w - 6, h - 6);
  g.fillStyle = '#5e4452'; g.font = 'italic 600 22px Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('Café Komorebi  ·  ' + P.plate, w / 2, h / 2 + 1);
});
B(3.6, 0.18, 0.02, boxMats('#dcb872', toonMap(plateTex)), 0, -1.35, 6.91, { outline: false });

/* ---------- Rues ---------- */
const asph = '#4a4c72', paint = '#f3ece2';
B(13, 0.03, 3.1, asph, 0, 0, 4.95, { outline: false, cast: false });
B(3.1, 0.03, 9.9, asph, -4.95, 0, -1.55, { outline: false, cast: false });
for (const x of [-0.2, 1.7, 3.6, 5.5]) B(1, 0.01, 0.1, paint, x, 0.03, 4.95, { outline: false, cast: false });
for (const z of [-5.8, -3.9, -2.0]) B(0.1, 0.01, 1, paint, -4.95, 0.03, z, { outline: false, cast: false });
for (let i = 0; i < 6; i++) {
  B(1.3, 0.012, 0.26, paint, -2.6, 0.03, 3.68 + i * 0.5, { outline: false, cast: false });
  B(0.26, 0.012, 1.3, paint, -3.68 - i * 0.5, 0.03, 2.6, { outline: false, cast: false });
}
Cy(0.3, 0.3, 0.012, '#5c5878', -4.7, 0.03, 4.7, { outline: false, cast: false });

/* ---------- Trottoir ---------- */
const tileTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#d2c3bc'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#c4b3ab'; g.fillRect(0, 0, w / 2, h / 2); g.fillRect(w / 2, h / 2, w / 2, h / 2);
  g.strokeStyle = '#a6958f'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
  g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
}, [9.9, 9.9]);
B(9.9, 0.15, 9.9, boxMats('#d9cfc6', toonMap(tileTex), 2), 1.55, 0, -1.55, { cast: false });
B(9.9, 0.17, 0.16, '#dcd3cc', 1.55, 0, 3.32, { cast: false });
B(0.16, 0.17, 9.9, '#dcd3cc', -3.32, 0, -1.55, { cast: false });

/* ---------- Café : rez-de-chaussée ---------- */
const GH = 3.1;
// façade avant (vert sauge)
B(0.6, GH, 0.2, C.sage, -1.9, y0, 0.1);
B(4.0, 0.6, 0.2, C.sage, 0.4, y0, 0.1);
B(6.8, 0.9, 0.2, C.sage, 1.8, y0 + 2.2, 0.1);
B(0.6, 2.2, 0.2, C.sage, 2.7, y0, 0.1);
B(1.1, 2.2, 0.2, C.sage, 4.65, y0, 0.1);
// façade latérale
B(0.2, GH, 2.0, C.sage, -2.1, y0, -4.6);
B(0.2, GH, 1.0, C.sage, -2.1, y0, -0.5);
B(0.2, 0.9, 2.6, C.sage, -2.1, y0, -2.3);
B(0.2, 1.0, 2.6, C.sage, -2.1, y0 + 2.1, -2.3);
// arrière + droite
B(7.4, GH, 0.2, C.cream, 1.5, y0, -5.5);
B(0.2, GH, 5.6, C.cream, 5.1, y0, -2.7);
// soubassement
B(7.55, 0.12, 0.08, '#6f957d', 1.5, y0, 0.22, { outline: false });

// vitrine principale
const glass = new THREE.MeshBasicMaterial({ color: '#ffe7c0', transparent: true, opacity: 0.16, depthWrite: false });
const streak = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.3, depthWrite: false });
B(4.0, 1.6, 0.03, glass, 0.4, y0 + 0.6, 0.1);
for (const x of [-0.27, 1.07]) B(0.07, 1.6, 0.08, C.trim, x, y0 + 0.6, 0.12);
B(4.0, 0.06, 0.08, C.trim, 0.4, y0 + 1.82, 0.12);
B(4.1, 0.08, 0.12, C.trim, 0.4, y0 + 2.16, 0.14);
for (const x of [-1.6, 2.4]) B(0.08, 1.6, 0.12, C.trim, x, y0 + 0.6, 0.14);
B(4.3, 0.08, 0.45, C.trim, 0.4, y0 + 0.52, 0.3); // rebord (le chat s'y assoit)
for (const x of [-1.25, -1.05, 0.2, 1.5]) B(0.09, 0.9, 0.005, streak, x, y0 + 0.85, 0.135, { rot: [0, 0, 0.55] });
const decal = canvasTex(512, 128, (g, w, h) => {
  g.fillStyle = '#f6d27a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'italic 600 54px Georgia, serif'; g.fillText('Coffee & Cake', w / 2, h / 2 - 8);
  g.font = '26px serif'; g.fillText('— 喫茶 —', w / 2, h / 2 + 38);
});
add(new THREE.PlaneGeometry(1.2, 0.3), new THREE.MeshBasicMaterial({ map: decal, transparent: true, depthWrite: false }), 0.4, y0 + 1.45, 0.125);

// vitrine latérale
B(0.03, 1.2, 2.6, glass, -2.1, y0 + 0.9, -2.3);
B(0.06, 1.2, 0.06, C.trim, -2.17, y0 + 0.9, -2.3);
B(0.06, 0.05, 2.6, C.trim, -2.17, y0 + 1.72, -2.3);
B(0.12, 0.08, 2.75, C.trim, -2.22, y0 + 2.08, -2.3);
B(0.4, 0.07, 2.85, C.trim, -2.3, y0 + 0.84, -2.3);
for (const z of [-3.6, -1.0]) B(0.12, 1.2, 0.08, C.trim, -2.22, y0 + 0.9, z);
for (const z of [-3.2, -1.9]) B(0.005, 0.8, 0.09, streak, -2.13, y0 + 1.05, z, { rot: [0.55, 0, 0] });

// porte
B(1.1, 2.2, 0.08, '#8a5a48', 3.55, y0, 0.05);
B(0.6, 0.85, 0.03, glow('#ffcf8a', 1.5), 3.55, y0 + 1.05, 0.1);
Sp(0.045, '#e2c27a', 3.95, y0 + 1.0, 0.14, { seg: 10 });
for (const x of [3.0, 4.1]) B(0.08, 2.25, 0.12, C.trim, x, y0, 0.14);
B(1.26, 0.08, 0.12, C.trim, 3.55, y0 + 2.2, 0.14);
B(1.4, 0.08, 0.4, '#d8cbbd', 3.55, y0, 0.4);

// pancarte de porte (ouvert / fermé)
const signTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#fdf1dd'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#8a5a48'; g.lineWidth = 8; g.strokeRect(6, 6, w - 12, h - 12);
  g.fillStyle = MODE === 'night' ? '#c0666a' : '#4f8a6a';
  g.font = 'italic 700 52px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(MODE === 'night' ? 'Closed' : 'Open', w / 2, h / 2 + 2);
});
const doorSign = G(3.55, y0 + 1.72, 0.14);
for (const s of [-1, 1]) rod([s * 0.12, 0, 0], [0, 0.12, 0], 0.006, C.iron, { parent: doorSign, outline: false });
B(0.34, 0.17, 0.02, boxMats('#fdf1dd', toonMap(signTex)), 0, -0.17, 0, { parent: doorSign, t: 0.012 });

// noren (rideau d'entrée)
const nShape = ch => canvasTex(256, 300, (g, w, h) => {
  g.fillStyle = '#56669a'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#46557f'; g.fillRect(0, h - 26, w, 26);
  g.fillStyle = '#fff6e6'; g.font = '150px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(ch, w / 2, h / 2 - 6);
});
rod([2.9, y0 + 2.2, 0.26], [4.2, y0 + 2.2, 0.26], 0.025, '#6e4a3e');
const norens = [];
['珈', '琲'].forEach((ch, i) => {
  const geo = new THREE.PlaneGeometry(0.52, 0.6); geo.translate(0, -0.3, 0);
  const m = add(geo, new THREE.MeshToonMaterial({ map: nShape(ch), gradientMap: grad, side: THREE.DoubleSide }), 3.285 + i * 0.535, y0 + 2.18, 0.27, { outline: false });
  norens.push(m);

const clouds = [];
function cloudTex() {
  const CL = P.clouds;
  return canvasTex(512, 256, (g, w, h) => {
    const n = 5 + (rnd() * 3 | 0), base = h * 0.72, blobs = [];
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), r = h * (0.17 + rnd() * 0.12) * (1.15 - Math.abs(u - 0.5) * 1.1);
      blobs.push([w * (0.16 + 0.68 * u) + (rnd() - 0.5) * 24, base - r * (0.45 + rnd() * 0.35), r]);
    }
    const shape = (pad) => {
      g.beginPath();
      for (const [x, y, r] of blobs) { g.moveTo(x + r + pad, y); g.arc(x, y, r + pad, 0, Math.PI * 2); }
      g.rect(w * 0.16 - pad, base - h * 0.12 - pad, w * 0.68 + 2 * pad, h * 0.12 + 2 * pad);
    };
    g.fillStyle = CL.line; shape(5); g.fill();
    g.fillStyle = CL.shade; shape(0); g.fill();
    g.save(); shape(0); g.clip();
    g.fillStyle = CL.top; g.beginPath();
    for (const [x, y, r] of blobs) { g.moveTo(x - r * 0.1 + r * 0.9, y - r * 0.2); g.arc(x - r * 0.1, y - r * 0.2, r * 0.9, 0, Math.PI * 2); }
    g.fill(); g.restore();
    g.globalCompositeOperation = 'destination-out'; g.fillRect(0, base + 5, w, h);
  });
}

let nextMeteor = 1.2, nextShower = 18;
const queued = [];
function launchMeteor(t, dirHint) {
  const M = meteors.find(o => !o.m.visible); if (!M) return;
  const w = skyH * camera.aspect, dir = dirHint ?? (rnd() < 0.5 ? -1 : 1);
  const ang = THREE.MathUtils.degToRad(18 + rnd() * 22);
  M.x = (rnd() * 1.4 - 0.7) * w - dir * 0.2 * w; M.y = skyH * (0.45 + rnd() * 0.45);
  M.dx = Math.cos(ang) * dir; M.dy = -Math.sin(ang);
  M.dist = skyH * (0.5 + rnd() * 0.4); M.len = skyH * (0.24 + rnd() * 0.14);
  M.dur = 0.7 + rnd() * 0.5; M.t0 = t;
  M.m.rotation.z = Math.atan2(M.dy, M.dx); M.m.visible = M.hd.visible = true;
}
function updateMeteors(t) {
  if (!meteors.length) return;
  if (t > nextMeteor) { launchMeteor(t); if (rnd() < 0.3) launchMeteor(t); nextMeteor = t + 1.8 + rnd() * 3.5; }
  // petite pluie d'étoiles filantes de temps en temps
  if (t > nextShower) {
    const dir = rnd() < 0.5 ? -1 : 1;
    for (let i = 0; i < 5; i++) queued.push([t + i * (0.18 + rnd() * 0.25), dir]);
    nextShower = t + 20 + rnd() * 15;
  }
  for (let i = queued.length - 1; i >= 0; i--) if (t >= queued[i][0]) { launchMeteor(t, queued[i][1]); queued.splice(i, 1); }
  for (const M of meteors) {
    if (!M.m.visible) continue;
    const u = (t - M.t0) / M.dur;
    if (u >= 1) { M.m.visible = M.hd.visible = false; continue; }
    const e = 1 - Math.pow(1 - u, 2), L = M.len * Math.min(1, u * 3) * (1 - 0.4 * u);
    const hx = M.x + M.dx * M.dist * e, hy = M.y + M.dy * M.dist * e;
    const a = Math.min(1, u * 6) * (1 - u * u);
    M.m.position.set(hx - M.dx * L / 2, hy - M.dy * L / 2, -SKY_D + 1.5);
    M.m.scale.set(L, skyH * 0.018, 1);
    M.m.material.opacity = a;
    M.hd.position.set(hx, hy, -SKY_D + 1.6);
    M.hd.scale.setScalar(skyH * (0.035 + 0.012 * Math.sin(t * 40)));
    M.hd.material.opacity = a;
  }
}

    const u = (t * L.sp + L.ph) % 1, f = Math.min(u / 0.8, 1);
    const top = y0 + 2.6, ground = y0 + 0.02;
    L.m.position.set(L.sx - L.drift * f + Math.sin(t * 1.3 + L.ph * 10) * 0.2 * f, top - (top - ground) * f, L.sz + Math.cos(t + L.ph * 7) * 0.25 * f);
    if (f < 1) L.m.rotation.set(t * 2 + L.ph * 5, t * 1.4, t * 0.9);
    else L.m.rotation.set(-Math.PI / 2, 0, L.ph * 6);
    L.m.scale.setScalar(u > 0.93 ? (1 - u) / 0.07 : u < 0.04 ? u / 0.04 : 1);
  }

  for (const b of birds) {
    const a = t * 0.13 - b.lag;
    birdPath(a, bp, b.side, b.dy); birdPath(a + 0.02, bn, b.side, b.dy);
    b.g.position.copy(bp); b.g.lookAt(bn);
    const glide = Math.sin(t * 0.7 + b.ph) > 0.55; // planer de temps en temps
    const f = glide ? 0.12 : Math.sin(t * b.flap + b.ph) * 0.65;
    b.r.rotation.z = f; b.l.rotation.z = -f;
  }

  for (const F of flies) {
    F.m.position.set(F.x + Math.sin(t * 0.5 * F.f + F.ph) * F.r, F.y + Math.sin(t * 0.8 * F.f + F.ph * 2) * 0.18, F.z + Math.cos(t * 0.4 * F.f + F.ph) * F.r);
    const b = Math.pow(Math.max(0, Math.sin(t * F.f * 1.6 + F.ph)), 3);
    F.m.material.color.copy(flyBase).multiplyScalar(0.25 + b * 3.2);
  }

  for (const c of clouds) {
    const w = skyH * camera.aspect, span = 2 * w + skyH * 1.4;
    const x = ((c.u + t * c.sp) % 1) * span - span / 2;
    c.m.position.set(x, skyH * c.y, c.z);
  }
  if (rays) rays.rotation.z = t * 0.03;

  updateMeteors(t);
  starSets.forEach((m, i) => (m.opacity = (0.75 + 0.25 * Math.sin(t * (0.8 + i * 0.6) + i * 2)) * (MODE === 'night' ? 1 : 0.5)));

  const tw = 0.85 + 0.15 * Math.sin(t * 2.1);
  if (P.lights > 0) {
    bulbA.color.copy(bulbBase[0]).multiplyScalar(tw);
    bulbB.color.copy(bulbBase[1]).multiplyScalar(1.85 - tw);
    lamp.intensity = P.lamp + Math.sin(t * 7) * 0.3;
    if (candle) candle.scale.set(1, 1.6 + Math.sin(t * 13) * 0.25, 1);
  }

  tail.rotation.y = Math.sin(t * (MODE === 'night' ? 0.6 : 1.6)) * (MODE === 'night' ? 0.15 : 0.35);
  if (MODE === 'night') {
    head.rotation.set(0.35 + Math.sin(t * 0.9) * 0.03, 0, 0.15); // dodo
    for (const Z of zzz) {
      const u = (t * 0.25 + Z.ph) % 1;
      Z.s.position.set(-0.95 + u * 0.25, y0 + 1.15 + u * 0.55, 0.45 + Math.sin(u * 6) * 0.04);
      Z.s.scale.setScalar(0.08 + u * 0.1);
      Z.s.material.opacity = Math.sin(Math.PI * u) * 0.9;
    }
  } else head.rotation.z = Math.sin(t * 0.45) * 0.1;
  norens.forEach((n, i) => (n.rotation.x = -Math.abs(Math.sin(t * 1.1 + i)) * 0.07));
  lanternPivot.rotation.x = Math.sin(t * 1.3) * 0.05;
  vaneTop.rotation.y = Math.sin(t * 0.3) * 0.6 + Math.sin(t * 1.7) * 0.08;
  crown.rotation.z = Math.sin(t * 0.8) * 0.012;
  doorSign.rotation.z = Math.sin(t * 0.9 + 1) * 0.04;
  fan.rotation.y = t * 6;

  controls.update();
  controls.target.clamp(tMin, tMax);
  composer.render();
});
</script>
